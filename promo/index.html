<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knowledge.Show(me) · 产品宣传片</title>
  <style>
    :root {
      --bg: #071614;
      --surface: rgba(14, 34, 32, 0.86);
      --line: rgba(120, 230, 205, 0.18);
      --accent: #1cb89a;
      --warm: #f2a94b;
      --text: #eaf8f4;
      --muted: #8fb4ad;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse 80% 70% at 50% 20%, #0f2c28 0%, #061311 75%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #player-shell {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 16px;
      gap: 14px;
    }
    .stage-wrap {
      position: relative;
      width: min(100%, calc((100vh - 138px) * 16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 30px 90px -20px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(120, 230, 205, 0.18);
      background: #061311;
    }
    #stage {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 45%, rgba(16, 48, 44, 0.35), rgba(5, 16, 15, 0.68));
      cursor: pointer;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .play-orb {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2be0bc, #0f967d 60%, #269be8);
      box-shadow: 0 0 0 14px rgba(28, 184, 154, 0.18), 0 20px 50px rgba(15, 150, 125, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    #start-overlay:hover .play-orb {
      transform: scale(1.07);
      box-shadow: 0 0 0 18px rgba(28, 184, 154, 0.26), 0 24px 60px rgba(15, 150, 125, 0.65);
    }
    .play-orb svg { margin-left: 5px; }
    .start-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .start-sub {
      font-size: 14px;
      color: var(--muted);
    }
    .hud {
      width: min(100%, calc((100vh - 138px) * 16 / 9));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(16px);
    }
    .hud-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .btn:hover { background: rgba(28, 184, 154, 0.18); border-color: rgba(28, 184, 154, 0.5); }
    .btn.primary {
      background: linear-gradient(135deg, #1cb89a, #0f967d);
      border-color: transparent;
      color: #ffffff;
    }
    #scrub {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 5px;
    }
    #time-label {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px;
      color: var(--muted);
      min-width: 96px;
      text-align: right;
    }
    #chapters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .ch-btn {
      border: 1px solid rgba(120, 230, 205, 0.14);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .ch-btn:hover { color: var(--text); border-color: rgba(28, 184, 154, 0.45); }
    .ch-btn.active {
      background: rgba(28, 184, 154, 0.22);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* 无头导出模式：纯净 1920x1080 全屏画布，无任何边距与控件 */
    body.capture-mode, body.capture-mode #player-shell {
      margin: 0;
      padding: 0;
      background: #000;
    }
    body.capture-mode .stage-wrap {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
    body.capture-mode .hud,
    body.capture-mode #start-overlay {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="player-shell">
    <div class="stage-wrap">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <div id="start-overlay" role="button" aria-label="播放宣传片">
        <div class="play-orb">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="start-title">Knowledge.Show(me) · 产品宣传片</div>
        <div class="start-sub">62.5 秒 · 1080p 纯 JS 脚本渲染 + Web Audio 同步配乐（点击播放 / 空格暂停）</div>
      </div>
    </div>
    <div class="hud">
      <div class="hud-top">
        <button id="btn-play" class="btn primary">▶ 播放</button>
        <button id="btn-restart" class="btn">↺ 重播</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="播放进度" />
        <span id="time-label">00:00 / 01:02</span>
        <button id="btn-mute" class="btn">🔊 声音</button>
        <button id="btn-full" class="btn">⛶ 全屏</button>
      </div>
      <div id="chapters" aria-label="章节跳转"></div>
    </div>
  </div>

  <script src="./src/core.js"></script>
  <script src="./src/audio.js"></script>
  <script src="./src/scenes-intro.js"></script>
  <script src="./src/scenes-flow.js"></script>
  <script src="./src/scenes-show.js"></script>
  <script src="./src/scenes-finish.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
