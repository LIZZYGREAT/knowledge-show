<!doctype html>
<html><head><meta charset="utf-8">
<title>知识视频编辑器</title>
<style>
  :root{
    --canvas:#f7f7f2;--surface:#fff;--soft:#eff2eb;--figure:#f0f4ed;
    --ink:#182a22;--muted:#586a5d;--line:#dce3d9;--line-strong:#a7b6a6;
    --accent:#2e6b4e;--accent-strong:#1b4a34;--accent-soft:#e2ebdc;
    --warm:#cfad72;--warm-strong:#8a5a25;
    --shadow:0 14px 36px rgb(24 42 34 / 14%);
    --shadow-soft:0 6px 20px rgb(24 42 34 / 7%);
    --font-body:"Aptos","Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --font-serif:"Cambria Math","STIX Two Math",Georgia,"Songti SC","Noto Serif CJK SC",serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--font-body)}
  *{box-sizing:border-box}
  .app{width:100vw;height:100vh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
  .msgs,.msgs *{user-select:text;-webkit-user-select:text}
  .topbar{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .title{font-family:var(--font-serif);font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
  .spacer{flex:1}
  .btn{font-size:12px;padding:6px 14px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:default}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-strong)}
  .main{flex:1;display:flex;min-height:0}
  .right{order:1}.chat{order:2}
  .chat{width:clamp(320px,20vw,420px);flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .chat-head{padding:15px 18px 12px;font-family:var(--font-serif);font-size:14px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line)}
  .msgs{flex:1;overflow-y:auto;scrollbar-width:none;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msgs::-webkit-scrollbar{display:none}
  .msg{font-size:13px;line-height:1.7;padding:10px 14px;border-radius:12px;max-width:285px}
  .msg.me{align-self:flex-end;background:var(--accent-soft);color:var(--accent-strong);border:1px solid #cbd9c5}
  .msg.ai{align-self:flex-start;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .msg .who{display:block;font-family:var(--font-serif);font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
  .input{margin:14px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.7;color:var(--ink);min-height:44px;max-height:140px;overflow-y:auto;outline:none;cursor:text;user-select:text;-webkit-user-select:text;scrollbar-width:none;transition:border-color .15s,box-shadow .15s,background .15s}
  .input::-webkit-scrollbar{display:none}
  .input:empty::before{content:attr(data-ph);color:#93a194}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .input.drop{border-color:var(--accent);background:#f6faf4;box-shadow:0 0 0 3px var(--accent-soft)}
  .chip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border:1px solid #b9cbb3;color:var(--accent-strong);border-radius:999px;padding:0 7px;margin:1px 4px 1px 0;font-size:11px;line-height:1.9;user-select:none;vertical-align:baseline}
  .chip .x{font-style:normal;cursor:pointer;color:var(--accent);padding:0 1px 0 3px}
  .chip .x:hover{color:var(--accent-strong)}
  .msg .chip{background:#fff;border-color:#c9d8c3;margin:2px 4px 2px 0}
  .drag-ghost{position:fixed;z-index:99;pointer-events:none;padding:4px 11px;border-radius:999px;border:1px solid;font-size:11px;font-weight:500;white-space:nowrap;box-shadow:0 8px 22px rgb(24 42 34 / 18%)}
  .right{flex:1;display:flex;flex-direction:column;min-width:0}
  .stage{flex:1;position:relative;background:var(--figure);display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
  .frame{position:relative;background:#0f1216;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line-strong),var(--shadow)}
  .frame iframe{display:block;width:100%;height:100%;border:0;background:#000}
  .load{position:absolute;inset:0;display:grid;place-items:center;background:var(--figure);color:var(--muted);font-size:13px;z-index:2}
  .stage-foot{position:absolute;left:22px;bottom:16px;display:flex;gap:8px;font-size:11px;color:var(--muted);pointer-events:none}
  .playbar{position:absolute;right:22px;bottom:12px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);background:rgb(255 255 255 / 88%);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;box-shadow:var(--shadow-soft)}
  .pbtn{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:10px;cursor:pointer;user-select:none}
  .pbtn:hover{background:var(--accent-strong)}
  .timeline{height:clamp(300px,32vh,360px);flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column}
  .tl-head{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .tl-tag{font-family:var(--font-serif);font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em}
  .tabs{display:flex;gap:2px;padding:3px;background:var(--soft);border:1px solid var(--line);border-radius:999px}
  .tab{font-size:11px;padding:3px 12px;border-radius:999px;color:var(--muted);cursor:pointer;user-select:none}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--surface);color:var(--accent-strong);font-weight:600;box-shadow:0 2px 8px rgb(24 42 34 / 10%)}
  .edit-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent-strong);background:var(--accent-soft);border:1px solid #b9cbb3;border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none}
  .edit-chip:hover{border-color:var(--accent)}
  .edit-chip .x{color:var(--accent);font-size:12px;line-height:1}
  .tl-body{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
  .ruler{position:relative;height:24px;flex:none;margin:0 14px 0 74px;border-bottom:1px solid var(--line);cursor:pointer;touch-action:none}
  .ruler span{position:absolute;bottom:5px;transform:translateX(-50%);font-size:10px;color:var(--muted)}
  .ruler i{position:absolute;bottom:0;width:1px;height:6px;background:var(--line-strong)}
  .tracks-wrap{position:relative;flex:1;display:flex;min-height:0}
  .hscroll{position:relative;flex:none;height:10px;margin:2px 14px 8px 74px;background:var(--soft);border:1px solid var(--line);border-radius:999px;cursor:pointer;touch-action:none}
  .hscroll.off{opacity:.4;pointer-events:none}
  .hthumb{position:absolute;top:1px;bottom:1px;left:0;width:100%;background:#c3cfc2;border-radius:999px;cursor:grab}
  .hthumb:active{cursor:grabbing;background:var(--line-strong)}
  .tracks{flex:1;padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto;scrollbar-width:none}
  .tracks::-webkit-scrollbar{display:none}
  .track{display:flex;align-items:stretch;gap:8px;flex:none;height:44px}
  .tlabel{width:52px;font-size:11px;color:var(--muted);text-align:right;flex:none;display:flex;align-items:center;justify-content:flex-end}
  .lane{position:relative;flex:1;height:100%;background:var(--figure);border:1px solid #e4e9df;border-radius:8px;cursor:pointer;touch-action:none}
  .clip{position:absolute;top:4px;bottom:4px;border-radius:6px;padding:0 8px;font-size:10.5px;font-weight:500;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:#1b4a34;background:#d6e7cf;border:1px solid #9cb894;box-shadow:0 1px 2px rgb(24 42 34 / 8%);cursor:grab}
  .clip.on{outline:2px solid var(--ink);outline-offset:-2px}
  .clip.sel{outline:2px solid var(--ink);outline-offset:-2px}
  .clip.dragging{opacity:.55;cursor:grabbing}
  .playline{position:absolute;width:2px;margin-left:-1px;background:var(--warm-strong);pointer-events:none;z-index:8}
  .playhead{position:absolute;width:20px;height:14px;margin-left:-10px;cursor:ew-resize;pointer-events:auto;touch-action:none;z-index:9}
  .playhead::before{content:"";position:absolute;left:50%;top:0;margin-left:-7px;border:7px solid transparent;border-top:10px solid var(--warm-strong);filter:drop-shadow(0 1px 1px rgb(24 42 34 / 20%))}
</style></head>
<body>
<div class="app">
  <div class="topbar">
    <div class="dot"></div>
    <div class="title">world.execute(me);</div>
    <div class="badge">16:9</div>
    <div class="badge" id="durBadge">3:27</div>
    <div class="spacer"></div>
    <div class="btn">保存</div>
    <div class="btn">导出</div>
    <div class="btn primary">生成成片</div>
  </div>

  <div class="main">
    <div class="right">
      <div class="stage" id="stage">
        <div class="frame" id="frame">
          <iframe id="player" src="/mv?t=15" allow="autoplay"></iframe>
          <div class="load" id="load">正在载入渲染器…</div>
        </div>
        <div class="stage-foot" id="stageFoot">正在载入</div>
        <div class="playbar"><div class="pbtn" id="playBtn">▶</div><span id="curTime">0:00 / 3:27</span></div>
      </div>

      <div class="timeline">
        <div class="tl-head"><span class="tl-tag">时间轴</span>
          <div class="tabs"><div class="tab on" id="tabScene">场景</div><div class="tab" id="tabAnim">动画</div></div>
          <div class="edit-chip" id="editChip" style="display:none">段落 · <span id="editName"></span><span class="x">×</span></div>
        </div>
        <div class="tl-body">
          <div class="ruler" id="ruler"></div>
          <div class="tracks-wrap">
            <div class="tracks" id="tracks"></div>
            <div class="playline" id="playline"></div>
            <div class="playhead" id="playhead" title="拖动定位"></div>
          </div>
          <div class="hscroll" id="hscroll" title="拖动平移时间轴"><div class="hthumb" id="hthumb"></div></div>
        </div>
      </div>
    </div>

    <!-- 右侧「对话修改」：后端是一个独立的修订会话（agent 会话，有自己的上下文和工具），
         不是页面内的逻辑；接入点见 sendChat()。
         职责：页面只负责看和挑——人框一段时间轴或拖一个组件进来，附一句意见；
         会话判断这条意见归哪层（方向/知识 → 知识层，节奏 → 脚本层，画面 → 动画层），
         派给对应层的会话做局部修订，拿回新版本回到页面。它围绕一个片子，改到满意即收。
         页面与会话具体怎么部署后续再定，这里不写死地址和进程。 -->
    <div class="chat">
      <div class="chat-head">对话修改</div>
      <div class="msgs">
        <div class="msg ai"><span class="who">白咲</span>world.execute(me); 的渲染器接进来了，时间轴按叙事段落切。点段落或拖时间轴都能定位。</div>
        <div class="msg me">先看看整体节奏</div>
        <div class="msg ai"><span class="who">白咲</span>好，空格开始播。哪段拖了、哪个转场太快，跟我说。</div>
      </div>
      <div class="input" id="chatInput" contenteditable="true" data-ph="说说想改哪里…" spellcheck="false"></div>
    </div>
  </div>
</div>

<script>
// ---------- 数据 ----------
const CHAPTERS = [
  ['开机', 0], ['标题', 15], ['第一段', 29], ['预副歌', 44], ['副歌', 59],
  ['第二段', 74], ['预副歌·二', 89], ['副歌·二', 103], ['独白', 118], ['错误', 125],
  ['执行循环', 148], ['计数', 159], ['副歌·变奏', 162], ['尾声', 177], ['关机', 192],
].map(([name, start]) => ({ name, start, end: null }));

let total = 207;
let ready = false, W = null, seekEl = null, playEl = null;

const player = document.getElementById('player');
const load = document.getElementById('load');
const playBtn = document.getElementById('playBtn');
const curTime = document.getElementById('curTime');
const stageFoot = document.getElementById('stageFoot');
const durBadge = document.getElementById('durBadge');
const ruler = document.getElementById('ruler');
const playhead = document.getElementById('playhead');
const playline = document.getElementById('playline');

function fmt(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2, '0');
}

// ---------- 等待渲染器 ----------
function waitForPreview() {
  try {
    const w = player.contentWindow;
    if (w && w.__preview && typeof w.__preview.setT === 'function') {
      W = w;
      ready = true;
      const eng = w.__preview.engine || {};
      total = Math.max(1, eng.duration || 207);
      CHAPTERS.forEach((c, i) => { c.end = i + 1 < CHAPTERS.length ? CHAPTERS[i + 1].start : total; });

      try {
        const d = w.document;
        const st = d.createElement('style');
        st.textContent = 'html,body{overflow:hidden!important;background:#000!important}' +
          '#wrap{margin:0!important;padding:0!important;max-width:none!important}' +
          '#stage{position:static!important}' +
          'canvas#view{display:block!important;width:100vw!important;height:100vh!important;max-width:none!important;border:0!important;aspect-ratio:auto!important}' +
          '#ui,#loading{display:none!important}';
        d.head.appendChild(st);
      } catch (e) {}

      try { seekEl = w.document.getElementById('seek'); } catch (e) {}
      try { playEl = w.document.getElementById('play'); } catch (e) {}

      load.style.display = 'none';
      durBadge.textContent = fmt(total);
      vS = 0; vE = total;
      buildAnimData();
      buildRuler();
      buildTracks();
      buildClips();
      setT(15);
      loop();
      return;
    }
  } catch (e) {}
  setTimeout(waitForPreview, 250);
}

// ---------- 时间轴 ----------
let mode = 'scene';         // 'scene' 场景轨 | 'anim' 组件轨（同一根时间轴，多条轨道）
let lastT = 0;
let vS = 0, vE = 207;       // 时间轴可视窗口（自由缩放/平移）
let editCh = -1;            // 双击主体进入的段落编辑模式
let animBlocks = { subject: [], caption: [], annotation: [], fx: [] };

const tabScene = document.getElementById('tabScene');
const tabAnim = document.getElementById('tabAnim');
const editChip = document.getElementById('editChip');
const editName = document.getElementById('editName');
const tracksEl = document.getElementById('tracks');
const tracksWrap = document.querySelector('.tracks-wrap');
const hscroll = document.getElementById('hscroll');
const hthumb = document.getElementById('hthumb');
const chatEl = document.querySelector('.chat');
const msgsEl = document.querySelector('.msgs');
const chatInput = document.getElementById('chatInput');

let selected = null;        // 当前选中的时间轴组件 { track, idx }

// 纸面低饱和多色板：鼠尾草 / 雾蓝 / 沙金 / 陶土 / 青灰 / 藕紫
const PALETTE = [
  { bg: '#c9dfc2', bd: '#7f9c76', fg: '#143a29' },
  { bg: '#ccdbe8', bd: '#8ba4b8', fg: '#27455a' },
  { bg: '#ecd8b5', bd: '#bd9a63', fg: '#664617' },
  { bg: '#e6cfc2', bd: '#bb8d75', fg: '#683c28' },
  { bg: '#cfe0dc', bd: '#8fada8', fg: '#2c4a46' },
  { bg: '#e2d3e0', bd: '#ac8ba9', fg: '#553652' },
];

const ANIM_TRACKS = [
  { id: 'subject', name: '主体', ...PALETTE[0] },
  { id: 'caption', name: '字幕', ...PALETTE[1] },
  { id: 'annotation', name: '标注', ...PALETTE[2] },
  { id: 'fx', name: '粒子', ...PALETTE[5] },
];

// 场景轨：各章按色板轮换，相邻章块一眼分开
function scenePalette(i) { return PALETTE[i % PALETTE.length]; }

// 动画层占位数据：同一根时间轴上，不同组件各占一条轨，便于分别选中
function buildAnimData() {
  animBlocks = { subject: [], caption: [], annotation: [], fx: [] };
  CHAPTERS.forEach((c, k) => {
    const d = c.end - c.start;
    const add = (tid, blk) => {
      blk.chapter = c.name;
      blk.ord = animBlocks[tid].filter(b => b.chapter === c.name).length + 1;
      animBlocks[tid].push(blk);
    };
    add('subject', { start: c.start, end: c.end, label: c.name });
    const n = Math.max(1, Math.min(4, Math.round(d / 7)));
    for (let i = 0; i < n; i++) {
      const center = c.start + d * (0.12 + 0.76 * (i + 0.5) / n);
      const w = Math.min(3.2, d * 0.22);
      add('caption', { start: Math.max(c.start, center - w / 2), end: Math.min(c.end, center + w / 2), label: '字幕' });
    }
    if (k % 3 === 0) {
      const st = c.start + d * 0.3;
      add('annotation', { start: st, end: Math.min(c.end, st + Math.min(3.4, d * 0.2)), label: '标注' });
    }
    if (k % 3 === 0 || k % 5 === 2) {
      add('fx', { start: c.start + d * 0.04, end: c.start + d * 0.3, label: '粒子' });
      if (d > 16) add('fx', { start: c.end - d * 0.22, end: c.end - d * 0.04, label: '粒子' });
    }
  });
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  editCh = -1; editChip.style.display = 'none';
  vS = 0; vE = total;
  tabScene.classList.toggle('on', m === 'scene');
  tabAnim.classList.toggle('on', m === 'anim');
  buildTracks();
  refreshTimeline();
}

// 当前可视窗口内的百分比位置
function pctOf(t) { return ((t - vS) / (vE - vS)) * 100; }

function refreshTimeline() {
  buildRuler();
  buildClips();
  updateHUD(lastT);
}

function buildRuler() {
  ruler.innerHTML = '';
  const span = vE - vS;
  const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  const step = steps.find(s => span / s <= 9) || 600;
  const first = Math.ceil(vS / step) * step;
  for (let s = first; s <= vE + 0.05; s += step) {
    const left = pctOf(s);
    const i = document.createElement('i'); i.style.left = left + '%'; ruler.appendChild(i);
    const sp = document.createElement('span'); sp.style.left = left + '%';
    sp.textContent = fmt(s); ruler.appendChild(sp);
  }
}

// 自由缩放：以光标处时间为锚点
function zoomAtTime(t, factor) {
  const span = vE - vS;
  const nspan = Math.max(1, Math.min(total, span * factor));
  const ratio = (t - vS) / span;
  let ns = t - ratio * nspan;
  ns = Math.max(0, Math.min(total - nspan, ns));
  vS = ns; vE = ns + nspan;
}

function timeAtClientX(clientX) {
  const wr = tracksWrap.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (clientX - wr.left - laneOff) / laneW));
  return vS + x * (vE - vS);
}

function enterChapterEdit(k) {
  const c = CHAPTERS[k];
  editCh = k;
  vS = c.start; vE = c.end;
  editName.textContent = c.name;
  editChip.style.display = 'flex';
  pausePlayback();
  setT(c.start);
  refreshTimeline();
}

function exitChapterEdit() {
  editCh = -1;
  editChip.style.display = 'none';
  vS = 0; vE = total;
  refreshTimeline();
}

function buildTracks() {
  tracksEl.innerHTML = '';
  const defs = mode === 'scene' ? [{ id: 'scene', name: '场景' }] : ANIM_TRACKS;
  defs.forEach(d => {
    const tr = document.createElement('div'); tr.className = 'track';
    const lb = document.createElement('div'); lb.className = 'tlabel'; lb.textContent = d.name;
    const ln = document.createElement('div'); ln.className = 'lane'; ln.dataset.track = d.id;
    tr.appendChild(lb); tr.appendChild(ln);
    tracksEl.appendChild(tr);
  });
  layoutPlayhead();
}

// 底部横向滚动条：滑块宽度=可视窗口占全长的比例
function updateHScroll() {
  const span = vE - vS;
  hscroll.classList.toggle('off', span >= total - 1e-6);
  hthumb.style.left = (vS / total * 100) + '%';
  hthumb.style.width = (span / total * 100) + '%';
}

function buildClips() {
  tracksEl.querySelectorAll('.lane').forEach(laneEl => {
    laneEl.innerHTML = '';               // 每次重建，清掉上一窗口的块
    const tid = laneEl.dataset.track;
    if (tid === 'scene') {
      CHAPTERS.forEach((c, i) => addClip(laneEl, c, { label: c.name, chapter: c.name, idx: i, ...scenePalette(i), track: 'scene' }));
    } else {
      const def = ANIM_TRACKS.find(t => t.id === tid);
      animBlocks[tid].forEach((b, i) => addClip(laneEl, b, { label: b.label, idx: i, bg: def.bg, bd: def.bd, fg: def.fg, track: tid }));
    }
  });
  updateHScroll();
}

function addClip(laneEl, blk, o) {
  const l = Math.max(blk.start, vS), r = Math.min(blk.end, vE);
  if (r <= l) return;                       // 完全在视窗外
  const el = document.createElement('div');
  el.className = 'clip';
  el.dataset.track = o.track;
  el.dataset.idx = o.idx;
  el.dataset.start = blk.start;
  el.dataset.end = blk.end;
  el.dataset.label = o.label;
  el.dataset.id = o.track + ':' + o.idx;
  const chapter = blk.chapter || o.chapter;
  if (chapter) el.dataset.chapter = chapter;
  if (blk.ord) el.dataset.ord = blk.ord;
  const wPct = Math.max(0.25, ((r - l) / (vE - vS)) * 100);
  el.style.left = pctOf(l) + '%';
  el.style.width = wPct + '%';
  el.style.background = o.bg;
  el.style.borderColor = o.bd;
  if (o.fg) el.style.color = o.fg;
  if (wPct >= 2.2) el.textContent = o.label;
  el.title = o.label + '  ' + fmt(blk.start) + '–' + fmt(blk.end);
  if (selected && selected.track === o.track && selected.idx === o.idx) el.classList.add('sel');
  laneEl.appendChild(el);
}

// 时间标横跨全部轨道，位置按第一根 lane 的几何算
let laneOff = 0, laneW = 1;
function layoutPlayhead() {
  const lanes = tracksEl.querySelectorAll('.lane');
  if (!lanes.length) return;
  const wr = tracksWrap.getBoundingClientRect();
  const first = lanes[0].getBoundingClientRect();
  const last = lanes[lanes.length - 1].getBoundingClientRect();
  laneOff = first.left - wr.left;
  laneW = first.width;
  // 倒三角把手：只在轨道上方一小块可拖；竖线纯显示，不挡下面轨道
  playhead.style.top = (first.top - wr.top - 14) + 'px';
  playline.style.top = (first.top - wr.top) + 'px';
  playline.style.height = (last.bottom - first.top) + 'px';
  updatePlayhead(lastT);
}

function updatePlayhead(t) {
  const inside = t >= vS - 1e-6 && t <= vE + 1e-6;
  const x = laneOff + Math.max(0, Math.min(1, (t - vS) / (vE - vS))) * laneW;
  playhead.style.left = x + 'px';
  playline.style.left = x + 'px';
  playhead.style.visibility = inside ? 'visible' : 'hidden';
  playline.style.visibility = inside ? 'visible' : 'hidden';
}

let pending = null;   // 刚设的时间，遮住 iframe 里还没刷新过来的旧 seek 值
function setT(v) {
  const t = Math.max(0, Math.min(total, v));
  pending = { t, at: performance.now() };
  if (W) { try { W.__preview.setT(t); } catch (e) {} }
  updateHUD(t);
}

function togglePlay() {
  if (!playEl) return;
  try { playEl.click(); } catch (e) {}
  updatePlayLabel();
}

function pausePlayback() {
  try {
    if (playEl && playEl.textContent.trim() === 'pause') playEl.click();
  } catch (e) {}
  updatePlayLabel();
}

function updatePlayLabel() {
  let playing = false;
  try { playing = playEl && playEl.textContent.trim() === 'pause'; } catch (e) {}
  playBtn.textContent = playing ? '❚❚' : '▶';
}

function chapterAt(t) {
  let k = 0;
  CHAPTERS.forEach((c, i) => { if (t >= c.start) k = i; });
  return k;
}

function updateHUD(t) {
  lastT = t;
  updatePlayhead(t);
  curTime.textContent = fmt(t) + ' / ' + fmt(total);
  const k = chapterAt(t), c = CHAPTERS[k];
  stageFoot.textContent = '第 ' + (k + 1) + ' 段 · ' + c.name + ' · ' + fmt(t - c.start) + ' / ' + fmt(c.end - c.start);
  tracksEl.querySelectorAll('.lane').forEach(laneEl => {
    const tid = laneEl.dataset.track;
    let on = -1;
    if (tid === 'scene') {
      on = k;
    } else {
      const arr = animBlocks[tid] || [];
      for (let i = 0; i < arr.length; i++) {
        if (t >= arr[i].start && t < arr[i].end) { on = i; break; }
      }
    }
    laneEl.querySelectorAll('.clip').forEach(el => el.classList.toggle('on', +el.dataset.idx === on));
  });
}

function loop() {
  let t = 0;
  if (pending && performance.now() - pending.at < 800) {
    t = pending.t;
  } else {
    pending = null;
    try { t = seekEl ? parseFloat(seekEl.value) || 0 : 0; } catch (e) {}
  }
  // 播放时若时间标跑出可视窗口，窗口跟着平移
  let playing = false;
  try { playing = playEl && playEl.textContent.trim() === 'pause'; } catch (e) {}
  const span = vE - vS;
  if (playing && span < total - 1e-6) {
    if (t > vE) { vS = Math.min(total - span, t - span * 0.02); vE = vS + span; refreshTimeline(); }
    else if (t < vS) { vS = Math.max(0, t - span * 0.98); vE = vS + span; refreshTimeline(); }
  }
  updateHUD(t);
  updatePlayLabel();
  requestAnimationFrame(loop);
}

// ---------- 交互 ----------
let dragging = false, headDrag = false;
function scrub(e) {
  setT(timeAtClientX(e.clientX));
}
tracksWrap.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.playhead')) {
    e.preventDefault();
    e.stopPropagation();
    pausePlayback();
    headDrag = true;
    try { playhead.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  const clip = e.target.closest('.clip');
  if (clip) {
    // 点段落/组件块：选中并让时间标落到它第一帧；按住拖动可拖进右侧对话
    e.preventDefault();
    pausePlayback();
    setT(Math.max(parseFloat(clip.dataset.start), vS));
    selectClip(clip);
    clipDrag = { clip, x: e.clientX, y: e.clientY, moved: false };
    return;
  }
  if (e.target.closest('.lane')) {
    e.preventDefault();
    pausePlayback();
    dragging = true;
    scrub(e);
    try { tracksWrap.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
tracksWrap.addEventListener('pointermove', (e) => { if (dragging || headDrag) scrub(e); });
tracksWrap.addEventListener('pointerup', () => { dragging = false; headDrag = false; });
tracksWrap.addEventListener('pointercancel', () => { dragging = false; headDrag = false; });

// ---------- 时间轴组件：选中，拖进右侧对话 ----------
let clipDrag = null;

function selectClip(clip) {
  tracksEl.querySelectorAll('.clip.sel').forEach(c => c.classList.remove('sel'));
  clip.classList.add('sel');
  selected = { track: clip.dataset.track, idx: +clip.dataset.idx };
}

function trackName(tid) {
  return tid === 'scene' ? '场景' : ((ANIM_TRACKS.find(t => t.id === tid) || {}).name || tid);
}

function clipChipText(clip) {
  const tid = clip.dataset.track;
  const chapter = clip.dataset.chapter || clip.dataset.label || '';
  if (tid === 'scene' || tid === 'subject') return trackName(tid) + ' · ' + chapter;
  const ord = +clip.dataset.ord || 0;
  const n = (animBlocks[tid] || []).filter(b => b.chapter === chapter).length;
  return trackName(tid) + ' · ' + chapter + (n > 1 && ord ? ' #' + ord : '');
}

function overChat(x, y) {
  const r = chatEl.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

function startClipGhost(e) {
  const clip = clipDrag.clip;
  clip.classList.add('dragging');
  const cs = getComputedStyle(clip);
  const g = document.createElement('div');
  g.className = 'drag-ghost';
  g.style.background = cs.backgroundColor;
  g.style.borderColor = cs.borderColor;
  g.style.color = cs.color;
  g.textContent = clipChipText(clip);
  document.body.appendChild(g);
  clipDrag.ghost = g;
  clipDrag.moved = true;
}

function moveClipGhost(e) {
  const g = clipDrag.ghost;
  if (g) { g.style.left = (e.clientX + 14) + 'px'; g.style.top = (e.clientY + 14) + 'px'; }
  chatInput.classList.toggle('drop', overChat(e.clientX, e.clientY));
}

function endClipDrag(e) {
  if (!clipDrag) return;
  const wasDrag = clipDrag.moved;
  if (clipDrag.ghost) clipDrag.ghost.remove();
  chatInput.classList.remove('drop');
  clipDrag.clip.classList.remove('dragging');
  if (wasDrag && e && overChat(e.clientX, e.clientY)) insertChip(clipDrag.clip);
  clipDrag = null;
}

window.addEventListener('pointermove', (e) => {
  if (!clipDrag) return;
  if (!clipDrag.moved) {
    if (Math.hypot(e.clientX - clipDrag.x, e.clientY - clipDrag.y) < 6) return;
    startClipGhost(e);
  }
  moveClipGhost(e);
});
window.addEventListener('pointerup', endClipDrag);
window.addEventListener('pointercancel', endClipDrag);

// 组件胶囊：把时间轴块的身份带进消息里，供后端会话识别。
// 契约（data-*，克隆进消息后保留）：
//   id        稳定标识：track:idx，如 caption:1 / scene:3
//   track     scene|subject|caption|annotation|fx
//   chapter   所属段落名，如 副歌
//   ord       同一段落内同轨道的序号（1 起）
//   startMs/endMs  组件的绝对时间（毫秒）
//   label/name     原始块标签与展示名
function insertChip(clip) {
  const name = clipChipText(clip);
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.contentEditable = 'false';
  chip.dataset.id = clip.dataset.id;
  chip.dataset.track = clip.dataset.track;
  chip.dataset.chapter = clip.dataset.chapter || '';
  chip.dataset.ord = clip.dataset.ord || '';
  chip.dataset.label = clip.dataset.label || '';
  chip.dataset.start = clip.dataset.start;
  chip.dataset.end = clip.dataset.end;
  chip.dataset.startMs = Math.round(+clip.dataset.start * 1000);
  chip.dataset.endMs = Math.round(+clip.dataset.end * 1000);
  chip.dataset.name = name;
  chip.title = name + '  ' + fmt(+clip.dataset.start) + '–' + fmt(+clip.dataset.end);
  chip.textContent = name;
  const x = document.createElement('i');
  x.className = 'x';
  x.textContent = '×';
  x.addEventListener('pointerdown', (ev) => { ev.preventDefault(); ev.stopPropagation(); chip.remove(); });
  chip.appendChild(x);
  chatInput.appendChild(chip);
  chatInput.appendChild(document.createTextNode('\u00a0'));
  chatInput.focus();
  const r = document.createRange();
  r.selectNodeContents(chatInput); r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

// 【后端接入点】右侧对话对应的是一个独立的修订会话：自有上下文和工具，
// 不共享本页状态。载荷 = 消息正文 + 胶囊上的 data-*（见 insertChip 上方契约，
// 即被引用的时间轴组件/范围）。会话拿到后判断意见归属层——
// 方向/知识 → 知识层，节奏 → 脚本层，画面 → 动画层——派给该层的会话做局部
// 修订，回收新版本。下面的本地追加只是原型演示，真实接入时替换成发往会话。
// 页面与会话具体怎么部署后续再定，这里不写死地址和进程。
function sendChat() {
  const hasChip = !!chatInput.querySelector('.chip');
  const text = (chatInput.innerText || '').replace(/\u00a0/g, ' ').trim();
  if (!text && !hasChip) return;
  const msg = document.createElement('div');
  msg.className = 'msg me';
  [...chatInput.childNodes].forEach(n => {
    if (n.nodeType === 1 && n.classList && n.classList.contains('chip')) {
      const c = n.cloneNode(true);
      const xx = c.querySelector('.x');
      if (xx) xx.remove();
      msg.appendChild(c);
    } else if (n.nodeType === 3) {
      if (n.textContent) msg.appendChild(document.createTextNode(n.textContent.replace(/\u00a0/g, ' ')));
    } else if (n.nodeType === 1) {
      msg.appendChild(n.cloneNode(true));
    }
  });
  msgsEl.appendChild(msg);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  chatInput.innerHTML = '';
  chatInput.focus();
}
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
chatInput.addEventListener('paste', (e) => {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, t);
});

// 双击「主体」块进入段落编辑；已在段落里再双击则回到主视图
tracksWrap.addEventListener('dblclick', (e) => {
  const clip = e.target.closest('.clip');
  if (!clip || clip.dataset.track !== 'subject') return;
  if (editCh >= 0) exitChapterEdit();
  else enterChapterEdit(+clip.dataset.idx);
});

// 滚轮纵向缩放，Shift+滚轮左右平移
function handleWheel(e) {
  e.preventDefault();
  const span = vE - vS;
  if (e.shiftKey) {
    const d = (e.deltaY > 0 ? 1 : -1) * span * 0.12;
    const ns = Math.max(0, Math.min(total - span, vS + d));
    vS = ns; vE = ns + span;
  } else {
    zoomAtTime(timeAtClientX(e.clientX), e.deltaY > 0 ? 1.18 : 1 / 1.18);
  }
  refreshTimeline();
}
tracksWrap.addEventListener('wheel', handleWheel, { passive: false });
ruler.addEventListener('wheel', handleWheel, { passive: false });

// 底部滚动条：拖动滑块平移可视窗口
let hDrag = null;
hscroll.addEventListener('pointerdown', (e) => {
  const span = vE - vS;
  if (span >= total - 1e-6) return;
  e.preventDefault();
  pausePlayback();
  const rect = hscroll.getBoundingClientRect();
  let grab = 0.5;
  if (e.target.closest('.hthumb')) {
    const tr = hthumb.getBoundingClientRect();
    grab = Math.max(0, Math.min(1, (e.clientX - tr.left) / tr.width));
  } else {
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const ns = Math.max(0, Math.min(total - span, ratio * total - span / 2));
    vS = ns; vE = ns + span;
    refreshTimeline();
  }
  hDrag = { grab };
  try { hscroll.setPointerCapture(e.pointerId); } catch (err) {}
});
hscroll.addEventListener('pointermove', (e) => {
  if (!hDrag) return;
  const span = vE - vS;
  const rect = hscroll.getBoundingClientRect();
  const thumbW = rect.width * span / total;
  const travel = rect.width - thumbW;
  if (travel <= 0) return;
  const left = Math.max(0, Math.min(travel, e.clientX - rect.left - hDrag.grab * thumbW));
  const ns = (left / travel) * (total - span);
  vS = ns; vE = ns + span;
  refreshTimeline();
});
hscroll.addEventListener('pointerup', () => { hDrag = null; });
hscroll.addEventListener('pointercancel', () => { hDrag = null; });

editChip.addEventListener('click', exitChapterEdit);

// 上方刻度条也能点/拖，等价于拖时间标
let rulerDrag = false;
ruler.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  pausePlayback();
  rulerDrag = true;
  scrub(e);
  try { ruler.setPointerCapture(e.pointerId); } catch (err) {}
});
ruler.addEventListener('pointermove', (e) => { if (rulerDrag) scrub(e); });
ruler.addEventListener('pointerup', () => { rulerDrag = false; });
ruler.addEventListener('pointercancel', () => { rulerDrag = false; });

tabScene.addEventListener('click', () => setMode('scene'));
tabAnim.addEventListener('click', () => setMode('anim'));
playBtn.addEventListener('click', togglePlay);

window.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.isContentEditable || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return; // 输入时不吃空格/方向键
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault();
    let t = 0;
    try { t = seekEl ? parseFloat(seekEl.value) || 0 : 0; } catch (err) {}
    setT(t + (e.code === 'ArrowLeft' ? -1 : 1));
  }
});

// ---------- 适配 ----------
function fitFrame() {
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const padX = 64, padTop = 36, padBottom = 72;
  const w = Math.max(200, stage.clientWidth - padX);
  let h = w * 9 / 16;
  const maxH = Math.max(120, stage.clientHeight - padTop - padBottom);
  if (h > maxH) { h = maxH; }
  const fw = h * 16 / 9;
  frame.style.width = fw + 'px';
  frame.style.height = h + 'px';
}

window.addEventListener('resize', () => { fitFrame(); layoutPlayhead(); });

fitFrame();
waitForPreview();
</script>
</body></html>
